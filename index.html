<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Countdown</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: #160b20;
    }
    .banner {
      width: min(100%, 1600px);
      min-height: min(88vh, 900px);
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 80px);
      text-align: center;
      background-image: linear-gradient(90deg, rgba(20, 7, 29, .72), rgba(20, 7, 29, .28)), url('https://wgl-dsites.net/genesisexpo/wp-content/uploads/2018/10/rev-slider-03.jpg');
      background-position: center;
      background-size: cover;
      border-radius: 8px;
    }
    .content { width: min(100%, 760px); text-shadow: 0 2px 18px rgba(0,0,0,.4); }
    h1 { margin: 0 0 14px; font-size: clamp(2rem, 5vw, 4.5rem); line-height: 1.05; }
    .accent { color: #fd226a; }
    .subtitle { margin: 0 0 32px; font-size: clamp(1rem, 2vw, 1.35rem); }
    .countdown { display: flex; justify-content: center; gap: clamp(12px, 3vw, 34px); flex-wrap: wrap; }
    .unit { min-width: 88px; padding: 17px 14px; background: rgba(20, 7, 29, .62); border: 1px solid rgba(255,255,255,.24); border-radius: 8px; }
    .number { display: block; color: #fd226a; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; line-height: 1; }
    .label { display: block; margin-top: 9px; font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; }
    @media (max-width: 520px) { .banner { min-height: 80vh; } .unit { min-width: 72px; padding: 14px 10px; } }
  </style>
</head>
<body>
  <main class="banner" aria-label="Event countdown banner">
    <section class="content">
      <h1>Event starts in <span class="accent">…</span></h1>
      <p class="subtitle">Counting down to October 22</p>
      <div class="countdown" role="timer" aria-live="polite">
        <div class="unit"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>
    </section>
  </main>
  <script>
    // October 22, 2026 at midnight in India (IST).
    const eventDate = new Date('2026-10-22T00:00:00+05:30').getTime();
    const fields = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    function updateCountdown() {
      const remaining = Math.max(0, eventDate - Date.now());
      const days = Math.floor(remaining / 86400000);
      const hours = Math.floor((remaining % 86400000) / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      fields.days.textContent = String(days).padStart(2, '0');
      fields.hours.textContent = String(hours).padStart(2, '0');
      fields.minutes.textContent = String(minutes).padStart(2, '0');
      fields.seconds.textContent = String(seconds).padStart(2, '0');
      if (remaining === 0) document.querySelector('.subtitle').textContent = 'The event is here!';
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
