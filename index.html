  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: #160b20;
    }
    .banner {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(32px, 7vw, 88px) 24px;
      text-align: center;
      background-image: linear-gradient(90deg, rgba(20, 7, 29, .72), rgba(20, 7, 29, .28)), url('a.png');
      background-position: center;
      background-size: cover;
    }
    .content { width: min(100%, 760px); text-shadow: 0 2px 18px rgba(0,0,0,.4); }
    h1 { margin: 0 0 14px; font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 800; line-height: 1.05; letter-spacing: .04em; }
    .accent { color: #fd226a; }
    .subtitle { margin: 0 0 32px; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.6; }
    .countdown { display: flex; justify-content: center; gap: clamp(18px, 6vw, 76px); margin: 0 0 42px; }
    .unit { min-width: 88px; }
    .number { display: block; color: #fff; font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 700; line-height: 1; }
    .label { display: block; margin-top: 12px; font-size: .85rem; text-transform: uppercase; letter-spacing: .12em; }
    .signup-copy { margin: 0 0 18px; font-size: .95rem; line-height: 1.6; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .signup-form { display: flex; width: min(100%, 560px); gap: 12px; margin: 0 auto; }
    .signup-form input {
      flex: 1;
      min-width: 0;
      padding: 15px 22px;
      color: #24182b;
      font: inherit;
      background: #fff;
      border: 0;
      border-radius: 999px;
    }
    .signup-form input:focus-visible, .signup-form button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .signup-form button {
      padding: 15px 30px;
      color: #fff;
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .06em;
      background: #fd226a;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }
    .signup-form button:hover { background: #e31358; }
    .signup-status { min-height: 1.5em; margin: 12px 0 0; font-size: .9rem; }
    @media (max-width: 520px) {
      .banner { padding-inline: 20px; }
      .countdown { gap: 12px; margin-bottom: 34px; }
      .unit { min-width: 68px; }
      .label { font-size: .7rem; letter-spacing: .08em; }
      .signup-form { flex-direction: column; }
      .signup-form button { min-height: 50px; }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Event countdown banner">
    <section class="content">
      <h1>LAUNCHING <span class="accent">SOON</span></h1>
      <p class="subtitle">We’re getting ready to launch. Stay tuned for something special!</p>
      <div class="countdown" role="timer" aria-label="Time remaining until launch" aria-live="off">
        <div class="unit"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
      </div>
      <p class="signup-copy">Be the first to know when we launch. Join our email list.</p>
      <form class="signup-form" id="signup-form">
        <label class="sr-only" for="email">Your email address</label>
        <input id="email" name="email" type="email" placeholder="Your email address" autocomplete="email" required>
        <button type="submit">SIGN UP</button>
      </form>
      <p class="signup-status" id="signup-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    // October 22, 2026 at midnight in India (IST).
    const eventDate = new Date('2026-10-31T00:00:00+05:30').getTime();
    const fields = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    const signupForm = document.getElementById('signup-form');
    const signupStatus = document.getElementById('signup-status');
    function updateCountdown() {
      const remaining = Math.max(0, eventDate - Date.now());
      const days = Math.floor(remaining / 86400000);
      const hours = Math.floor((remaining % 86400000) / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      fields.days.textContent = String(days).padStart(2, '0');
      fields.hours.textContent = String(hours).padStart(2, '0');
      fields.minutes.textContent = String(minutes).padStart(2, '0');
      fields.seconds.textContent = String(seconds).padStart(2, '0');
      if (remaining === 0) document.querySelector('.subtitle').textContent = 'We’re live! Thanks for stopping by.';
    }
    signupForm.addEventListener('submit', (event) => {
      event.preventDefault();
      signupStatus.textContent = 'Thanks! Email signup is not connected to a mailing list yet.';
    });
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
